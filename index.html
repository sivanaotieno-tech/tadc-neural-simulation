<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TADC Neural Simulation</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#09051a;color:#fff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;padding:24px;box-sizing:border-box}.title{font-size:clamp(24px,4vw,52px);font-weight:800;text-shadow:0 0 20px #ff4fd8}.panel{position:absolute;left:24px;bottom:24px;padding:18px 20px;border:1px solid #ffffff33;border-radius:16px;background:#100b25cc;backdrop-filter:blur(12px);max-width:330px}.bubble{color:#7ee7ff}.status{margin-top:8px;font-size:13px;opacity:.75}</style>
</head><body><canvas id="c"></canvas><div class="hud"><div class="title">NEURAL CIRCUS</div><div class="panel"><b>Brain Simulation</b><div>Human neural model</div><div class="bubble">Bubble — fruit-fly neural model</div><div class="status">Interactive TADC-inspired environment • Move your pointer</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,t=0,mx=.5,my=.5;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
function brain(cx,cy,s,fly=false){x.save();x.translate(cx+(mx-.5)*35,cy+(my-.5)*25);x.rotate(Math.sin(t*.35)*.08);x.globalCompositeOperation='lighter';let g=x.createRadialGradient(0,0,5,0,0,s);g.addColorStop(0,fly?'#9fffff':'#ff8df0');g.addColorStop(.45,fly?'#37b8ff':'#b64cff');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(0,0,s,0,7);x.fill();x.strokeStyle=fly?'#7de9ff':'#ff72df';x.lineWidth=2;for(let i=0;i<90;i++){let a=i*2.399+t*(fly?.15:.08),r=s*(.15+.75*((i*37)%100)/100);let px=Math.cos(a)*r,py=Math.sin(a)*r*.72;x.beginPath();x.arc(px,py,fly?1.4:2,0,7);x.stroke();if(i%3===0){x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a+1)*25,py+Math.sin(a+1)*25);x.stroke()}}x.restore()}
function loop(){t+=.016;x.clearRect(0,0,W,H);let grd=x.createRadialGradient(W*.5,H*.45,20,W*.5,H*.5,Math.max(W,H));grd.addColorStop(0,'#24104b');grd.addColorStop(1,'#05020d');x.fillStyle=grd;x.fillRect(0,0,W,H);for(let i=0;i<40;i++){let a=i*.7+t*.2,r=Math.min(W,H)*(.2+(i%8)*.055);x.fillStyle=i%2?'#ff4fd855':'#55dfff55';x.beginPath();x.arc(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*.5,2+(i%4),0,7);x.fill()}brain(W*.34,H*.49,170,false);brain(W*.68,H*.49,115,true);requestAnimationFrame(loop)}loop();
</script></body></html>
